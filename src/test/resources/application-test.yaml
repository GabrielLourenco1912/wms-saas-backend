spring:
  datasource:
    url: jdbc:h2:mem:wms-saas-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

api:
  security:
    jwt:
      secret: test-only-secret-key-with-at-least-32-characters
    account-lock:
      scheduler-enabled: false
